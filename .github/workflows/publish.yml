name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'release' && toJSON(github.event.release.prerelease) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release identity
        id: release
        run: node scripts/release-metadata.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Pack and verify the publication artifact
        env:
          PACKAGE_FILE: ${{ steps.release.outputs.package_file }}
        run: |
          mkdir -p .agent-tmp/release
          pnpm pack --pack-destination .agent-tmp/release
          node scripts/check-package.mjs ".agent-tmp/release/$PACKAGE_FILE"
      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          PACKAGE_FILE: ${{ steps.release.outputs.package_file }}
          # Optional bootstrap token; omit after configuring npm Trusted Publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ".agent-tmp/release/$PACKAGE_FILE" --access public --provenance --tag "$DIST_TAG"
